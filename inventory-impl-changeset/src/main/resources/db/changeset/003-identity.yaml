databaseChangeLog:
  - changeSet:
      id: 003-identity
      author: phase-15
      comment: >
        Users, the bearer tokens that guard the API, and federated identities.
        (provider, subject) is the stable key — email is profile data, because
        providers like Apple hand out per-app relay addresses.

        inventory_members (2026-08-31, PLAN.md Phase 27) records who belongs
        to which inventory, and as what. It is a reservation: nothing reads
        it until the phase's enforcement steps land.
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: varchar(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: text
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_users_email
              - column:
                  name: display_name
                  type: text
              - column:
                  name: password_hash
                  type: text
              - column:
                  name: admin
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createTable:
            tableName: api_tokens
            columns:
              - column:
                  name: token
                  type: text
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_tokens_user
                    deleteCascade: true
              - column:
                  name: issued_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: revoked
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createTable:
            tableName: user_identities
            columns:
              - column:
                  name: provider
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_identities_user
                    deleteCascade: true
        - addPrimaryKey:
            tableName: user_identities
            columnNames: provider, subject
            constraintName: pk_user_identities
        - createIndex:
            tableName: user_identities
            indexName: idx_identities_user
            columns:
              - column:
                  name: user_id
        # The tenancy reservation (PLAN.md Phase 27): membership, recorded
        # but not yet enforced. role stays free text until the phase decides
        # the vocabulary (owner/member/reader is the working guess).
        - createTable:
            tableName: inventory_members
            columns:
              - column:
                  name: inventory_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: inventories(id)
                    foreignKeyName: fk_members_inventory
                    deleteCascade: true
              - column:
                  name: user_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_members_user
                    deleteCascade: true
              - column:
                  name: role
                  type: text
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: inventory_members
            columnNames: inventory_id, user_id
            constraintName: pk_inventory_members
        - createIndex:
            tableName: inventory_members
            indexName: idx_members_user
            columns:
              - column:
                  name: user_id
