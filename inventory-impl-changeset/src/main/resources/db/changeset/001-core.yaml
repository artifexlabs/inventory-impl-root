databaseChangeLog:
  - changeSet:
      id: 001-core
      author: phase-15
      comment: >
        Items, their tags, and the physical markers that resolve to them.

        Collapsed twice, both times because nothing had ever been deployed:
        Phase 15 (2026-08-15) folded the accreted 001-013 changesets into
        four, and 2026-08-23 folded the later additions in here too. What is
        left expresses the schema as it should have been, with no ALTER
        replaying a decision that could simply have been made correctly the
        first time.

        Containment is a TREE, not a graph: container_id is a single optional
        self-reference, because a physical thing is in exactly one place. The
        old locations table and item_containment join table are gone — a
        location is simply a container that carries coordinates, and items
        without their own coordinates inherit the nearest ancestor's.

        Tenancy (reserved 2026-08-31, PLAN.md Phase 27): every item belongs
        to exactly one inventory, and the zero-ULID "default" inventory is
        seeded so a single-tenant install never notices. Markers are unique
        per inventory, not globally. Enforcement — membership, scoped
        queries — is deferred; the columns are not, because this file stops
        being editable the first time a database anyone cares about runs it.
      changes:
        # who an item belongs to; enforcement arrives with Phase 27, the
        # seeded default makes the column invisible until then
        - createTable:
            tableName: inventories
            columns:
              - column:
                  name: id
                  type: varchar(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: ts
                  type: timestamptz
                  constraints:
                    nullable: false
        - insert:
            tableName: inventories
            columns:
              - column:
                  name: id
                  value: "00000000000000000000000000"
              - column:
                  name: name
                  value: "default"
              - column:
                  name: ts
                  valueComputed: now()
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: varchar(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: text
              - column:
                  name: type
                  type: text
                  defaultValue: "_"
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              # single optional parent; orphaning on delete beats cascading a
              # subtree into oblivion because a shelf was removed
              - column:
                  name: container_id
                  type: varchar(26)
              # own coordinates; absent means "inherit from the container chain"
              - column:
                  name: latitude
                  type: double precision
              - column:
                  name: longitude
                  type: double precision
              # human judgment ("two-person lift"), NOT derived from weight_grams
              - column:
                  name: heavy
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
              # true = hard stop; false = a recommendation
              - column:
                  name: expiration_absolute
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: data_kind
                  type: text
              - column:
                  name: data_mutable
                  type: boolean
              - column:
                  name: data_archive
                  type: boolean
              # where a medium is reached when it is not simply in your hands:
              # a mount point, share URI, volume label, or bucket. Free text on
              # purpose — it names things this system does not manage.
              - column:
                  name: data_locator
                  type: text
              - column:
                  name: quantity
                  type: bigint
              - column:
                  name: weight_grams
                  type: double precision
              - column:
                  name: length_cm
                  type: double precision
              - column:
                  name: width_cm
                  type: double precision
              - column:
                  name: height_cm
                  type: double precision
              - column:
                  name: min_on_hand
                  type: bigint
              - column:
                  name: max_on_hand
                  type: bigint
              - column:
                  name: ts
                  type: timestamptz
                  constraints:
                    nullable: false
              # the tenancy reservation: exactly one owning inventory (the
              # zero-ULID default until Phase 27's enforcement arrives)
              - column:
                  name: inventory_id
                  type: varchar(26)
                  defaultValue: "00000000000000000000000000"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: items
            baseColumnNames: container_id
            referencedTableName: items
            referencedColumnNames: id
            constraintName: fk_items_container
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: items
            baseColumnNames: inventory_id
            referencedTableName: inventories
            referencedColumnNames: id
            constraintName: fk_items_inventory
        - createIndex:
            tableName: items
            indexName: idx_items_inventory
            columns:
              - column:
                  name: inventory_id
        - createIndex:
            tableName: items
            indexName: idx_items_type
            columns:
              - column:
                  name: type
        - createIndex:
            tableName: items
            indexName: idx_items_container
            columns:
              - column:
                  name: container_id
        # key with optional value: "scuba" renders bare, "color=orange" with it
        - createTable:
            tableName: item_tags
            columns:
              - column:
                  name: item_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: items(id)
                    foreignKeyName: fk_tags_item
                    deleteCascade: true
              - column:
                  name: tag_key
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: tag_value
                  type: text
        - addPrimaryKey:
            tableName: item_tags
            columnNames: item_id, tag_key
            constraintName: pk_item_tags
        # search by key existence across the whole inventory
        - createIndex:
            tableName: item_tags
            indexName: idx_tags_key
            columns:
              - column:
                  name: tag_key
        # Physical markers resolving to items: one (inventory, kind, value)
        # -> item_id mapping for every marker type (nfc-uid, upc, foreign
        # qr, ...), the same shape as user_identities(provider, subject)
        # rather than a bespoke column per marker. WITHIN an inventory a
        # marker claims at most one item; two inventories may each claim the
        # same class-level marker — both own the banana UPC (owner,
        # 2026-08-31, Phase 27). inventory_id is denormalized from the
        # item's row because a primary key cannot span a join; whatever
        # transfers an item between inventories must move its markers too.
        - createTable:
            tableName: item_identities
            columns:
              - column:
                  name: inventory_id
                  type: varchar(26)
                  defaultValue: "00000000000000000000000000"
                  constraints:
                    nullable: false
                    references: inventories(id)
                    foreignKeyName: fk_item_identities_inventory
              - column:
                  name: kind
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: items(id)
                    foreignKeyName: fk_item_identities_item
                    deleteCascade: true
        - addPrimaryKey:
            tableName: item_identities
            columnNames: inventory_id, kind, value
            constraintName: pk_item_identities
        # list an item's markers without a full scan
        - createIndex:
            tableName: item_identities
            indexName: idx_item_identities_item
            columns:
              - column:
                  name: item_id
