databaseChangeLog:
  - changeSet:
      id: 001-core
      author: phase-15
      comment: >
        Items, their tags, and the physical markers that resolve to them.

        Collapsed twice, both times because nothing had ever been deployed:
        Phase 15 (2026-08-15) folded the accreted 001-013 changesets into
        four, and 2026-08-23 folded the later additions in here too. What is
        left expresses the schema as it should have been, with no ALTER
        replaying a decision that could simply have been made correctly the
        first time.

        Containment is a TREE, not a graph: container_id is a single optional
        self-reference, because a physical thing is in exactly one place. The
        old locations table and item_containment join table are gone — a
        location is simply a container that carries coordinates, and items
        without their own coordinates inherit the nearest ancestor's.
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: varchar(26)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: text
              - column:
                  name: type
                  type: text
                  defaultValue: "_"
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              # single optional parent; orphaning on delete beats cascading a
              # subtree into oblivion because a shelf was removed
              - column:
                  name: container_id
                  type: varchar(26)
              # own coordinates; absent means "inherit from the container chain"
              - column:
                  name: latitude
                  type: double precision
              - column:
                  name: longitude
                  type: double precision
              # human judgment ("two-person lift"), NOT derived from weight_grams
              - column:
                  name: heavy
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamptz
              # true = hard stop; false = a recommendation
              - column:
                  name: expiration_absolute
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: data_kind
                  type: text
              - column:
                  name: data_mutable
                  type: boolean
              - column:
                  name: data_archive
                  type: boolean
              # where a medium is reached when it is not simply in your hands:
              # a mount point, share URI, volume label, or bucket. Free text on
              # purpose — it names things this system does not manage.
              - column:
                  name: data_locator
                  type: text
              - column:
                  name: quantity
                  type: bigint
              - column:
                  name: weight_grams
                  type: double precision
              - column:
                  name: length_cm
                  type: double precision
              - column:
                  name: width_cm
                  type: double precision
              - column:
                  name: height_cm
                  type: double precision
              - column:
                  name: min_on_hand
                  type: bigint
              - column:
                  name: max_on_hand
                  type: bigint
              - column:
                  name: ts
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: items
            baseColumnNames: container_id
            referencedTableName: items
            referencedColumnNames: id
            constraintName: fk_items_container
            onDelete: SET NULL
        - createIndex:
            tableName: items
            indexName: idx_items_type
            columns:
              - column:
                  name: type
        - createIndex:
            tableName: items
            indexName: idx_items_container
            columns:
              - column:
                  name: container_id
        # key with optional value: "scuba" renders bare, "color=orange" with it
        - createTable:
            tableName: item_tags
            columns:
              - column:
                  name: item_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: items(id)
                    foreignKeyName: fk_tags_item
                    deleteCascade: true
              - column:
                  name: tag_key
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: tag_value
                  type: text
        - addPrimaryKey:
            tableName: item_tags
            columnNames: item_id, tag_key
            constraintName: pk_item_tags
        # search by key existence across the whole inventory
        - createIndex:
            tableName: item_tags
            indexName: idx_tags_key
            columns:
              - column:
                  name: tag_key
        # Physical markers resolving to items: one (kind, value) -> item_id
        # mapping for every marker type (nfc-uid, upc, foreign qr, ...), the
        # same shape as user_identities(provider, subject) rather than a
        # bespoke column per marker. A marker claims at most one item.
        - createTable:
            tableName: item_identities
            columns:
              - column:
                  name: kind
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: value
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: item_id
                  type: varchar(26)
                  constraints:
                    nullable: false
                    references: items(id)
                    foreignKeyName: fk_item_identities_item
                    deleteCascade: true
        - addPrimaryKey:
            tableName: item_identities
            columnNames: kind, value
            constraintName: pk_item_identities
        # list an item's markers without a full scan
        - createIndex:
            tableName: item_identities
            indexName: idx_item_identities_item
            columns:
              - column:
                  name: item_id
